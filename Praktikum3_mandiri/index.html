<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page - Biodata Diri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Frame -->
        <header class="header-frame">
            <iframe src="header.html" frameborder="0" scrolling="no"></iframe>
        </header>

        <!-- Content Area (Main + Sidebar) -->
        <div class="content-wrapper">
            <!-- Main Content Area -->
            <main class="main-frame">
                <iframe src="main.html" name="showframe" frameborder="0"></iframe>
            </main>

            <!-- Sidebar Area -->
            <aside class="sidebar-frame">
                <iframe src="sidebar.html" frameborder="0"></iframe>
            </aside>
        </div>

        <!-- Footer Frame -->
        <footer class="footer-frame">
            <iframe src="footer.html" frameborder="0" scrolling="no"></iframe>
        </footer>
    </div>
</body>
</html>
